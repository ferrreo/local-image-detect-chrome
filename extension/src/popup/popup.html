<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TruePixel</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="brand">TruePixel</p>
        <p class="tag">Local AI image detection</p>
      </header>

      <section class="status" aria-live="polite">
        <p><span class="label">Models</span> <span id="modelStatus">…</span></p>
        <p><span class="label">Backend</span> <span id="backendStatus">…</span></p>
        <p><span class="label">Threshold</span> <span id="thresholdStatus">65%</span></p>
      </section>

      <section class="actions">
        <button id="setupBtn" type="button">Download models</button>
        <button id="rescanBtn" type="button" class="secondary">Rescan page</button>
        <label class="toggle">
          <input id="autoScan" type="checkbox" checked />
          Auto-scan images
        </label>
      </section>

      <p id="message" class="message"></p>
      <footer>
        <a href="options.html" target="_blank" rel="noreferrer">Options</a>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
