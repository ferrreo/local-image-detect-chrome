<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TruePixel fixture gallery</title>
  <style>
    body { font-family: Georgia, serif; margin: 24px; background: #f3efe6; color: #222; }
    h1 { margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(3, 200px); gap: 16px; }
    figure { margin: 0; }
    img { width: 192px; height: 192px; display: block; background: #ddd; }
    figcaption { margin-top: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Fixture gallery</h1>
  <div class="grid">
    <figure>
      <img src="../images/ai_smooth_1.png" alt="ai" width="192" height="192" />
      <figcaption data-label="ai">ai_smooth_1.png</figcaption>
    </figure>
<figure>
      <img src="../images/ai_smooth_2.png" alt="ai" width="192" height="192" />
      <figcaption data-label="ai">ai_smooth_2.png</figcaption>
    </figure>
<figure>
      <img src="../images/ai_smooth_3.png" alt="ai" width="192" height="192" />
      <figcaption data-label="ai">ai_smooth_3.png</figcaption>
    </figure>
<figure>
      <img src="../images/real_noise_1.png" alt="real" width="192" height="192" />
      <figcaption data-label="real">real_noise_1.png</figcaption>
    </figure>
<figure>
      <img src="../images/real_noise_2.png" alt="real" width="192" height="192" />
      <figcaption data-label="real">real_noise_2.png</figcaption>
    </figure>
<figure>
      <img src="../images/real_noise_3.png" alt="real" width="192" height="192" />
      <figcaption data-label="real">real_noise_3.png</figcaption>
    </figure>
  </div>
</body>
</html>
